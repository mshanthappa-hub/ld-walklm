  ld_snapshot: cf2804b08c1cb4453ca7950d9f20b3d3bc7a43e4

external_data: true
features:
  ld_bert_hidden_state: 768
  embeddinggemma_300m_walklm: 768
  raw_ogb: 100
  combined: 1636
  concatenation_order: [ld_bert_hidden_state, embeddinggemma_300m_walklm, raw_ogb]
  artifacts:
    ld:
      filename: hidden_state.pt
      expected_shape: [2449029, 768]
