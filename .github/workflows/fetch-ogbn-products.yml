name: Temporary official ogbn-products relay

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fetch-ogbn-products.yml

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download and verify official OGB archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p relay
          source_url="https://snap.stanford.edu/ogb/data/nodeproppred/products.zip"
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --output relay/products.zip "$source_url"
          unzip -t relay/products.zip
          sha256sum relay/products.zip > relay/products.zip.sha256
          stat --printf='source=%s\nbytes=%s\n' "$source_url" \
            "$(stat --printf='%s' relay/products.zip)" > relay/SOURCE.txt
          split --bytes=500M --numeric-suffixes=0 --suffix-length=2 \
            relay/products.zip relay/products.zip.part-
          rm relay/products.zip

      - name: Upload one-day private artifact
        uses: actions/upload-artifact@v4
        with:
          name: ogbn-products-official
          path: relay/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
